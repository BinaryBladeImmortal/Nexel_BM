<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Central hexagon -->
  <polygon points="200,50 250,100 250,150 200,200 150,150 150,100" 
           fill="none" 
           stroke="url(#neon)" 
           stroke-width="2" 
           opacity="0.8"/>
  
  <!-- Inner hexagon -->
  <polygon points="200,80 230,110 230,140 200,170 170,140 170,110" 
           fill="none" 
           stroke="#00d4ff" 
           stroke-width="1" 
           opacity="0.6"/>
  
  <!-- Corner accents -->
  <circle cx="50" cy="50" r="3" fill="#00d4ff" opacity="0.7"/>
  <circle cx="350" cy="50" r="3" fill="#ff0080" opacity="0.7"/>
  <circle cx="50" cy="250" r="3" fill="#ff0080" opacity="0.7"/>
  <circle cx="350" cy="250" r="3" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Text -->
  <text x="200" y="240" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" opacity="0.8">
    NEXEL ASSET
  </text>
</svg>
